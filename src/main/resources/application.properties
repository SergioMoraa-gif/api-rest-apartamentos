spring.application.name=apartamentos

# lee el archivo .env (si existe) para no dejar las credenciales en el codigo
spring.config.import=optional:file:.env[.properties]

# puerto de la api
server.port=${SERVER_PORT:8000}

# conexion a MySQL (los valores reales van en el .env)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/apartamentos?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# hibernate crea/actualiza las tablas solo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
